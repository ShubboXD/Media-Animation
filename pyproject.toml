[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "volume-osd"
version = "1.0.0"
description = "Sleek, fluid-animated volume & media on-screen display HUD"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "FluidOSD Contributors" }]
dependencies = [
    "PyQt5>=5.15.0",
]

[project.scripts]
volume-osd = "volume_osd.cli:main"
